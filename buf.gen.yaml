version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ursakhiin/underdraw/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
  - local: ["go", "run", "./cmd/protoc-gen-underdraw-mcp"]
    out: gen/go
    opt: paths=source_relative
