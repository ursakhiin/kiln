version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ursakhiin/kiln/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
  # Add once cmd/protoc-gen-kiln-mcp is implemented:
  # - local: ["go", "run", "./cmd/protoc-gen-kiln-mcp"]
  #   out: gen/go
  #   opt: paths=source_relative
